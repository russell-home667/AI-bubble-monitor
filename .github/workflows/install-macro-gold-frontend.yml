name: Install Macro Gold Frontend

on:
  push:
    branches: [main]
    paths:
      - 'scripts/install_macro_gold_frontend.py'
      - '.github/workflows/install-macro-gold-frontend.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align Macro Commodity gold source
        run: python scripts/install_macro_gold_frontend.py

      - name: Validate frontend
        run: |
          grep -q "Gold XAU/USD" index.html
          grep -q "Gold USD/oz" index.html
          grep -q "XAUS Gold Data API" index.html
          grep -q "xausGold" assets/source-links.js
          grep -q "https://xaus.com/" assets/source-links.js
          grep -q "gold_xauusd.json" index.html

      - name: Commit frontend
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/source-links.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: align XAU/USD gold source with XAUS'
          git pull --rebase origin main
          git push origin HEAD:main
