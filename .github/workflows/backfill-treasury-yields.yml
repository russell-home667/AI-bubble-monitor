name: Backfill US Treasury Yield History

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backfill-treasury-yields.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'pandas>=2.2' 'requests>=2.32' 'yfinance>=0.2.65'

      - name: Backfill nominal Treasury yields
        run: python scripts/update_ai_market_liquidity.py --group macro

      - name: Validate full official history
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path

          root = Path('data/ai_bubble/market_liquidity')
          summary = {}
          for key, expected_start in [('dgs10','1962-01-02'), ('dgs30','1977-02-15')]:
              p = root / f'{key}.csv'
              if not p.exists():
                  raise SystemExit(f'{p} missing')
              df = pd.read_csv(p)
              df['date'] = pd.to_datetime(df['date'], errors='coerce')
              df['value'] = pd.to_numeric(df['value'], errors='coerce')
              df = df.dropna(subset=['date','value']).sort_values('date')
              start = df.iloc[0]['date'].strftime('%Y-%m-%d')
              end = df.iloc[-1]['date'].strftime('%Y-%m-%d')
              if start != expected_start:
                  raise SystemExit(f'{key} start {start}, expected {expected_start}')
              summary[key] = {
                  'rows': int(len(df)),
                  'start': start,
                  'end': end,
                  'latest_value_pct': float(df.iloc[-1]['value']),
              }
          d30 = pd.read_csv(root/'dgs30.csv')
          d30['date'] = pd.to_datetime(d30['date'], errors='coerce')
          gap = d30[(d30['date'] >= '2002-02-19') & (d30['date'] <= '2006-02-08')]
          if not gap.empty:
              raise SystemExit(f'DGS30 official publication gap unexpectedly contains {len(gap)} stored observations')
          latest = json.loads((root/'latest.json').read_text(encoding='utf-8'))
          for key in ['dgs10','dgs30']:
              if not latest.get('indicators',{}).get(key):
                  raise SystemExit(f'{key} missing from latest.json')
          print(json.dumps(summary, indent=2))
          print('DGS30 official 2002-02-19..2006-02-08 publication gap preserved: yes')
          PY

      - name: Commit backfilled history
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ai_bubble/market_liquidity/dgs10.csv \
                  data/ai_bubble/market_liquidity/dgs30.csv \
                  data/ai_bubble/market_liquidity/dfii10.csv \
                  data/ai_bubble/market_liquidity/latest.json
          if git diff --cached --quiet; then
            echo 'No Treasury data changes to commit.'
            exit 0
          fi
          git commit -m 'data: backfill US 10Y and 30Y Treasury yields'
          git pull --rebase origin main
          git push origin HEAD:main
