name: One-off P1/P2 data-quality hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p1p2-hardening.yml'
      - 'scripts/apply_p1p2_hardening.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p1p2-data-quality-hardening
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply P1/P2 source hardening
        run: python scripts/apply_p1p2_hardening.py

      - name: Validate patched sources
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/update_ai_gpu_prices.py scripts/calculate_ai_derived_indicators.py
          python - <<'PY'
          import re, subprocess, tempfile
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',html,flags=re.I|re.S)
          checked=0
          for i,code in enumerate(blocks):
              if not code.strip():
                  continue
              p=Path(tempfile.gettempdir())/f'ai-bubble-p1p2-inline-{i}.js'
              p.write_text(code,encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True)
              checked+=1
          if checked < 2:
              raise SystemExit(f'Unexpected inline JS count: {checked}')
          print('validated inline JS blocks:',checked)
          PY

      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/update_ai_gpu_prices.py scripts/calculate_ai_derived_indicators.py index.html
          if git diff --cached --quiet; then
            echo 'No P1/P2 source changes needed'
            exit 0
          fi
          git commit -m 'fix: harden data quality and freshness semantics'
          bash scripts/git_commit_push_retry.sh
