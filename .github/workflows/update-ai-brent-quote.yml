name: Update AI Brent Quote

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-ai-brent-quote.yml'
      - 'scripts/update_ai_brent_quote.py'
      - 'index.html'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * 1-6'
      timezone: 'Asia/Shanghai'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-brent-quote
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure Brent seed exists
        run: |
          if [ ! -f data/ai_bubble/macro/brent.json ]; then
            pip install 'yfinance==1.7.0' 'requests>=2.32'
            python scripts/update_ai_brent.py
          fi
      - name: Update latest BZ=F 1-minute source bar
        run: python scripts/update_ai_brent_quote.py
      - name: Validate previous completed close
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/ai_bubble/macro/brent.json').read_text())
          q=d.get('latest_quote') or {}
          assert float(q.get('price')) > 1
          assert float(q.get('previous_close')) > 1
          assert isinstance(q.get('change_vs_previous_close_pct'), (int,float))
          print('Brent', q['price'], 'prev', q['previous_close'], 'change%', q['change_vs_previous_close_pct'])
          PY
      - name: Detect changes
        id: detect
        run: |
          if git diff --quiet -- data/ai_bubble/macro/brent.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Commit data
        if: steps.detect.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ai_bubble/macro/brent.json
          git commit -m 'data: update Brent quote'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Configure Pages
        if: steps.detect.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.detect.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy Pages
        if: steps.detect.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

