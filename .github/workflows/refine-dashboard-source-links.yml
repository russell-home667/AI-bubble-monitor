name: Refine Dashboard Source Links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-dashboard-source-links.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Complete link rules
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/source-links.js')
          s=p.read_text(encoding='utf-8')
          old="'ai bubble score','ai breakdown score','current regime',"
          new="'ai bubble score','ai breakdown score','bubble score','breakdown score','current regime',"
          if old not in s:
              raise SystemExit('score rule anchor not found')
          s=s.replace(old,new,1)
          old2="if (t.includes('market prices') || t.includes('market price trend')) return many(MARKET);"
          new2="if (t.includes('market prices') || t.includes('market price trend') || t.includes('market trend')) return many(MARKET);"
          if old2 not in s:
              raise SystemExit('market trend rule anchor not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/source-links.js
          git commit -m 'ui: complete dashboard source-link coverage'
          git pull --rebase origin main
          git push origin HEAD:main
