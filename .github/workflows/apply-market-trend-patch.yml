name: Apply Market Trend Frontend Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-market-trend-patch.yml'
      - 'scripts/patch_market_trend_frontend.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-market-trend-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply focused frontend patch
        run: python scripts/patch_market_trend_frontend.py
      - name: Validate JavaScript syntax
        run: node --check assets/chart-time-slider.js
      - name: Commit patched frontend
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/chart-time-slider.js; then
            echo 'Frontend already patched'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/chart-time-slider.js
          git commit -m 'ui: finish market trend live quote redesign'
          git pull --rebase origin main
          git push origin HEAD:main
