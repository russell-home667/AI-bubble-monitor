name: One-time ECharts Safe Init Hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-bubble-echarts-hotfix
  cancel-in-progress: true

jobs:
  hotfix:
    if: ${{ !contains(github.event.head_commit.message, 'hotfix: remove pre-render ECharts mutation') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove unsafe pre-render setOption
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('assets/chart-time-slider.js')
          text = p.read_text(encoding='utf-8')
          old = """    patched.add(chart);\n    if (TIME_CHART_IDS.has(chartId)) {\n      let initial = {grid:{bottom:57}};\n      if (chartId === 'marketChart') initial = tuneMarketOption(initial);\n      if (chartId === 'liquidityChart') initial = tuneLiquidityOption(initial);\n      originalSetOption({...initial,dataZoom:aviationDataZoom(chartId)},false);\n    }\n"""
          new = """    patched.add(chart);\n"""
          if old not in text:
              raise SystemExit('Unsafe pre-render ECharts block not found; refusing to guess')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
          node --check assets/chart-time-slider.js
          if grep -Fq "originalSetOption({...initial,dataZoom:aviationDataZoom(chartId)},false);" assets/chart-time-slider.js; then
            echo 'Unsafe pre-render setOption still present' >&2
            exit 1
          fi

      - name: Persist safe ECharts init
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/chart-time-slider.js
          git commit -m "hotfix: remove pre-render ECharts mutation"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
