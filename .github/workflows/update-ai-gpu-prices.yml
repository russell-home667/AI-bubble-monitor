name: Update AI GPU Rental Prices

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_ai_gpu_prices.py'
      - '.github/workflows/update-ai-gpu-prices.yml'
  schedule:
    # Hourly marketplace snapshot. Minute 17 avoids the top-of-hour GitHub Actions rush.
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: ai-gpu-rental-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'pandas>=2.2' 'requests>=2.32' 'beautifulsoup4>=4.12' 'vastai'
      - name: Update GPU rental price snapshots
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${VAST_API_KEY:-}" ]; then
            echo "Vast.ai API key detected: live marketplace mode enabled"
          else
            echo "::warning::VAST_API_KEY is not configured; GPU module will use Runpod as display-only fallback"
          fi
          if [ -n "${RUNPOD_API_KEY:-}" ]; then
            echo "Runpod API key detected: API v2 catalog + availability enabled"
          else
            echo "::warning::RUNPOD_API_KEY is not configured; Runpod public-page fallback will be used"
          fi
          python scripts/update_ai_gpu_prices.py
      - name: Validate generated module
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/ai_bubble/gpu_rental_prices/latest.json')
          if not p.exists(): raise SystemExit('latest.json missing')
          d=json.loads(p.read_text(encoding='utf-8'))
          if d.get('errors'): raise SystemExit(f"Errors: {d['errors']}")
          g=d.get('gpus',{})
          for name in ['H100','H200','B200']:
              if name not in g or not g[name].get('daily_price_usd_per_gpu_hr'):
                  raise SystemExit(f'Missing GPU price: {name}')
              status=g[name].get('status')
              if status not in {'LIVE_MARKET','REFERENCE_FALLBACK','STALE_ANCHOR'}:
                  raise SystemExit(f'Unexpected GPU status for {name}: {status}')

          quality=d.get('data_quality') or {}
          if quality.get('level') not in {'live_market','reference','stale'}:
              raise SystemExit(f"Missing/invalid data_quality.level: {quality}")
          if bool(d.get('scoring_eligible')) != bool(quality.get('scoring_eligible')):
              raise SystemExit('scoring_eligible mismatch between root and data_quality')
          if d.get('scoring_eligible'):
              bad=[k for k,v in g.items() if v.get('status')!='LIVE_MARKET']
              if bad: raise SystemExit(f'Scoring marked eligible with non-live GPUs: {bad}')
          else:
              print('GPU module is reference/degraded and will be excluded from existing composite scoring')

          if d.get('runpod_api_key_configured') and d.get('runpod_status') == 'LIVE_API_V2':
              bad=[]
              for name,v in g.items():
                  rp=v.get('runpod') or {}
                  if rp.get('status')!='LIVE_API_V2' or not rp.get('community_price_usd_per_gpu_hr'):
                      bad.append(name)
              if bad:
                  raise SystemExit(f'Runpod API marked live but missing GPU data: {bad}')
              cp=d.get('cross_platform_composite') or {}
              expected_cross=sum(
                  1 for v in g.values()
                  if v.get('status')=='LIVE_MARKET'
                  and (v.get('runpod') or {}).get('status')=='LIVE_API_V2'
              )
              if int(cp.get('gpu_count') or 0) != expected_cross:
                  raise SystemExit(
                      f'Cross-platform coverage mismatch: expected {expected_cross}, got {cp}'
                  )
              if bool(cp.get('eligible')) != bool(expected_cross == 3):
                  raise SystemExit(
                      f'Cross-platform eligibility mismatch for coverage {expected_cross}: {cp}'
                  )
          elif d.get('runpod_api_key_configured'):
              print(f"::warning::Runpod API degraded; fallback preserved: {d.get('runpod_error')}")

          for pth in [
              Path('data/ai_bubble/gpu_rental_prices/platform_daily.csv'),
              Path('data/ai_bubble/gpu_rental_prices/cross_platform_composite_daily.csv'),
          ]:
              if not pth.exists():
                  raise SystemExit(f'Missing generated cross-platform file: {pth}')

          import csv
          cp_path=Path('data/ai_bubble/gpu_rental_prices/cross_platform_composite_daily.csv')
          with cp_path.open(encoding='utf-8') as fh:
              rows=list(csv.DictReader(fh))
          for row in rows:
              if int(float(row.get('gpu_count') or 0)) != 3:
                  raise SystemExit(f'Historical cross-platform composite is not full 3/3 coverage: {row}')
              if row.get('gpu_set') and row.get('gpu_set') != 'B200,H100,H200':
                  raise SystemExit(f'Unexpected historical GPU basket: {row}')

          expected_cross_eligible=all(
              v.get('status')=='LIVE_MARKET'
              and (v.get('runpod') or {}).get('status')=='LIVE_API_V2'
              for v in g.values()
          )
          if bool(d.get('cross_platform_eligible')) != bool(expected_cross_eligible):
              raise SystemExit('cross_platform_eligible root flag mismatch')

          print({k:{
              'vast':v.get('daily_price_usd_per_gpu_hr'),
              'status':v.get('status'),
              'runpod':(v.get('runpod') or {}).get('community_price_usd_per_gpu_hr'),
              'availability':(v.get('runpod') or {}).get('availability')
          } for k,v in g.items()})
          PY
      - name: Commit refreshed data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ai_bubble/gpu_rental_prices/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: refresh AI GPU rental prices'
          bash scripts/git_commit_push_retry.sh

