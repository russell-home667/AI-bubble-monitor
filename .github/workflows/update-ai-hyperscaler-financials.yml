name: Update AI Hyperscaler Financials

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_ai_hyperscaler_financials.py'
      - 'scripts/apply_ai_hyperscaler_overrides.py'
      - 'data/ai_bubble/hyperscalers/official_overrides.csv'
      - '.github/workflows/update-ai-hyperscaler-financials.yml'
  schedule:
    - cron: '0 9 * * *'
      timezone: 'Asia/Shanghai'

permissions:
  contents: write

concurrency:
  group: ai-hyperscaler-financials
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'pandas>=2.2' 'requests>=2.32' 'yfinance>=0.2.65'
      - name: Update standardized hyperscaler financials
        run: |
          set -euo pipefail
          python scripts/update_ai_hyperscaler_financials.py
          python scripts/apply_ai_hyperscaler_overrides.py
      - name: Validate generated module
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/ai_bubble/hyperscalers/latest.json')
          if not p.exists(): raise SystemExit('latest.json missing')
          d=json.loads(p.read_text(encoding='utf-8'))
          if len(d.get('companies',{})) != 5: raise SystemExit('Expected 5 companies')
          if d.get('errors'): raise SystemExit(f"Errors: {d['errors']}")
          if not d.get('h5_latest_complete'): raise SystemExit('No complete H5 quarter')
          print('Latest complete H5:', d['h5_latest_complete'].get('calendar_quarter'))
          PY
      - name: Commit refreshed data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ai_bubble/hyperscalers/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: refresh AI hyperscaler financials'
          git pull --rebase origin main
          git push origin HEAD:main
