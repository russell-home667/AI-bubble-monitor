name: Patch Treasury Card Layout

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_treasury_card_layout.py'
      - '.github/workflows/patch-treasury-card-layout.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-treasury-card-layout
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply layout patch
        run: python scripts/patch_treasury_card_layout.py

      - name: Validate JavaScript
        run: |
          node --check assets/chart-time-slider.js
          grep -q "Latest available ·" assets/chart-time-slider.js
          grep -q "Source ·" assets/chart-time-slider.js
          grep -q "quote.insertBefore(el, dateEl)" assets/chart-time-slider.js

      - name: Commit patched asset
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/chart-time-slider.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'style: simplify treasury quote cards'
          git pull --rebase origin main
          git push origin HEAD:main
