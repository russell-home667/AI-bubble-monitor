name: Update AI Brent Daily History

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-ai-brent-daily.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * *'
      timezone: 'Asia/Shanghai'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-brent-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install 'yfinance==1.7.0' 'requests>=2.32'
      - name: Update Brent history
        run: python scripts/update_ai_brent.py
      - name: Detect changes
        id: detect
        run: |
          if git diff --quiet -- data/ai_bubble/macro/brent.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Commit data
        if: steps.detect.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ai_bubble/macro/brent.json
          git commit -m 'data: update Brent daily history'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Configure Pages
        if: steps.detect.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.detect.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy Pages
        if: steps.detect.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

