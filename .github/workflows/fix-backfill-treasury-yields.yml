name: Fix and Backfill US Treasury Yields

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-backfill-treasury-yields.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair macro block indentation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/update_ai_market_liquidity.py')
          s = p.read_text(encoding='utf-8')
          bad = '''    if group in {"all", "macro"}:
          for key in ["dfii10", "dgs10", "dgs30"]:
              try:
                  fred_download(key, FRED[key])
                  print(f"OK fred {key}")
              except Exception as exc:  # noqa: BLE001
                  errors[key] = str(exc)
                  print(f"ERROR {key}: {exc}", file=sys.stderr)
          '''
          # Also handle the exact malformed version with no indentation after the if.
          malformed = '''    if group in {"all", "macro"}:
          for key in ["dfii10", "dgs10", "dgs30"]:
              try:
                  fred_download(key, FRED[key])
                  print(f"OK fred {key}")
              except Exception as exc:  # noqa: BLE001
                  errors[key] = str(exc)
                  print(f"ERROR {key}: {exc}", file=sys.stderr)
          '''
          exact = '''    if group in {"all", "macro"}:
          for key in ["dfii10", "dgs10", "dgs30"]:
              try:
                  fred_download(key, FRED[key])
                  print(f"OK fred {key}")
              except Exception as exc:  # noqa: BLE001
                  errors[key] = str(exc)
                  print(f"ERROR {key}: {exc}", file=sys.stderr)
          '''
          # Perform a line-oriented repair so whitespace in the broken block cannot matter.
          lines = s.splitlines()
          for i, line in enumerate(lines):
              if line.strip() == 'if group in {"all", "macro"}:':
                  if i + 1 < len(lines) and lines[i+1].strip() == 'for key in ["dfii10", "dgs10", "dgs30"]:':
                      lines[i] = '    if group in {"all", "macro"}:'
                      lines[i+1] = '        for key in ["dfii10", "dgs10", "dgs30"]:'
                      # Repair the nested try/except body until the credit block starts.
                      j = i + 2
                      while j < len(lines) and lines[j].strip() != 'if group in {"all", "credit"}:':
                          stripped = lines[j].lstrip()
                          if stripped.startswith('try:') or stripped.startswith('except '):
                              lines[j] = '            ' + stripped
                          elif stripped:
                              lines[j] = '                ' + stripped
                          j += 1
                      break
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python -m py_compile scripts/update_ai_market_liquidity.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'pandas>=2.2' 'requests>=2.32' 'yfinance>=0.2.65'

      - name: Backfill nominal Treasury yields
        run: python scripts/update_ai_market_liquidity.py --group macro

      - name: Validate history and official gap
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          root = Path('data/ai_bubble/market_liquidity')
          summary = {}
          for key, expected_start in [('dgs10','1962-01-02'), ('dgs30','1977-02-15')]:
              df = pd.read_csv(root/f'{key}.csv')
              df['date'] = pd.to_datetime(df['date'], errors='coerce')
              df['value'] = pd.to_numeric(df['value'], errors='coerce')
              df = df.dropna(subset=['date','value']).sort_values('date')
              start = df.iloc[0]['date'].strftime('%Y-%m-%d')
              end = df.iloc[-1]['date'].strftime('%Y-%m-%d')
              if start != expected_start:
                  raise SystemExit(f'{key} starts {start}; expected {expected_start}')
              summary[key] = {'rows': int(len(df)), 'start': start, 'end': end, 'latest_value_pct': float(df.iloc[-1]['value'])}
          d30 = pd.read_csv(root/'dgs30.csv')
          d30['date'] = pd.to_datetime(d30['date'], errors='coerce')
          gap = d30[(d30['date'] >= '2002-02-19') & (d30['date'] <= '2006-02-08')]
          if not gap.empty:
              raise SystemExit(f'DGS30 official publication gap contains {len(gap)} observations')
          latest = json.loads((root/'latest.json').read_text(encoding='utf-8'))
          if not latest.get('indicators',{}).get('dgs10') or not latest.get('indicators',{}).get('dgs30'):
              raise SystemExit('Treasury indicators missing from latest.json')
          print(json.dumps(summary, indent=2))
          print('DGS30 official 2002-02-19..2006-02-08 publication gap preserved: yes')
          PY

      - name: Commit repaired pipeline and full history
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/update_ai_market_liquidity.py \
                  data/ai_bubble/market_liquidity/dgs10.csv \
                  data/ai_bubble/market_liquidity/dgs30.csv \
                  data/ai_bubble/market_liquidity/dfii10.csv \
                  data/ai_bubble/market_liquidity/latest.json
          git commit -m 'Fix Treasury updater and backfill full yield history'
          git pull --rebase origin main
          git push origin HEAD:main
