name: Patch Treasury Change Badges

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-treasury-change-badges.yml'

permissions:
  contents: write

concurrency:
  group: patch-treasury-change-badges
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Treasury tiles
        run: python scripts/patch_treasury_change_badges.py

      - name: Validate patched JavaScript
        run: |
          grep -q "setTreasuryChangeBadges('liq10y'" assets/chart-time-slider.js
          grep -q "setTreasuryChangeBadges('liq30y'" assets/chart-time-slider.js
          grep -q "liq-change-stack" assets/chart-time-slider.js
          node --check assets/chart-time-slider.js

      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/chart-time-slider.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'feat: show Treasury 1D and 1M changes'
          git pull --rebase origin main
          git push origin HEAD:main
