name: Deploy AI Bubble Monitor Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Update AI Bubble Market & Liquidity"
      - "Update AI Market Quotes"
    types: [completed]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-bubble-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Harden dashboard CSV loading
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '/* RESILIENT_CSV_LOADER */'

          if marker not in text:
              signature = 'async function load(){try{const [top,derived,market,hyper,compute,gpu,ndx,sox,nvda,vix,dfii10,dgs10,dgs30,hy,h5,tsmc,gpud,scoreHistory]=await Promise.all(['
              start = text.find(signature)
              end = text.find('bindRanges();load();', start)
              if start < 0 or end < 0:
                  raise SystemExit('Could not locate dashboard load() block; refusing an unsafe patch.')

              block = text[start:end]
              block = block.replace(
                  'async function load(){try{',
                  "async function load(){try{/* RESILIENT_CSV_LOADER */const safeCSV=async path=>{try{return await fetchCSV(path)}catch(e){console.warn('Optional CSV load failed',path,e);return[]}};",
                  1,
              )
              block = block.replace('fetchCSV(BASE+', 'safeCSV(BASE+')
              text = text[:start] + block + text[end:]
              p.write_text(text, encoding='utf-8')
          PY

      - name: Persist loader hardening
        shell: bash
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "fix: make dashboard CSV loading resilient"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
