name: Deploy AI Bubble Monitor Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Update AI Bubble Market & Liquidity"
      - "Update AI Market Quotes"
      - "Update AI Bubble News Radar"
      - "Update AI GPU Rental Prices"
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ai-bubble-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate frontend JavaScript
        run: |
          set -euo pipefail
          node --check assets/chart-time-slider.js
          node --check assets/source-links.js
          node --check assets/ai-news.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
