name: Deploy AI Bubble Monitor Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Update AI Bubble Market & Liquidity"
      - "Update AI Market Quotes"
    types: [completed]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-bubble-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Harden dashboard frontend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Keep CSV failures isolated so one unavailable series cannot blank the whole dashboard.
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '/* RESILIENT_CSV_LOADER */'
          if marker not in text:
              signature = 'async function load(){try{const [top,derived,market,hyper,compute,gpu,ndx,sox,nvda,vix,dfii10,dgs10,dgs30,hy,h5,tsmc,gpud,scoreHistory]=await Promise.all(['
              start = text.find(signature)
              end = text.find('bindRanges();load();', start)
              if start < 0 or end < 0:
                  raise SystemExit('Could not locate dashboard load() block; refusing an unsafe patch.')
              block = text[start:end]
              block = block.replace(
                  'async function load(){try{',
                  "async function load(){try{/* RESILIENT_CSV_LOADER */const safeCSV=async path=>{try{return await fetchCSV(path)}catch(e){console.warn('Optional CSV load failed',path,e);return[]}};",
                  1,
              )
              block = block.replace('fetchCSV(BASE+', 'safeCSV(BASE+')
              text = text[:start] + block + text[end:]
              p.write_text(text, encoding='utf-8')

          # Liquidity headline tiles: intraday 10Y/30Y/VIX, official latest for slower series.
          p = Path('assets/chart-time-slider.js')
          text = p.read_text(encoding='utf-8')
          marker = '// LIVE_LIQUIDITY_TILES_V2'
          if marker not in text:
              start = text.find('  function setLiquidityQuote(')
              end = text.find('  function syncLiquiditySources()', start)
              if start < 0 or end < 0:
                  raise SystemExit('Could not locate liquidity quote functions; refusing an unsafe patch.')

              replacement = r'''  // LIVE_LIQUIDITY_TILES_V2
  function summaryIntradayQuote(key) {
    const x = marketSummaryPayload?.indicators?.[key];
    if (!x?.live_quote_timestamp || !Number.isFinite(Number(x?.value))) return null;
    return {
      price:Number(x.value),
      timestamp:x.live_quote_timestamp,
      source:x.live_quote_source || 'Yahoo Finance',
      quote_status:x.live_quote_status || null
    };
  }

  function setLiquidityQuote(id, payload, decimals, mode='daily') {
    const valueEl = document.getElementById(`${id}Value`);
    const dateEl = document.getElementById(`${id}Date`);
    if (!payload) {
      if (valueEl) valueEl.textContent = '—';
      if (dateEl) dateEl.textContent = 'Latest · —';
      return;
    }

    const rawValue = mode === 'intraday'
      ? Number(payload?.price ?? payload?.value)
      : Number(payload?.value ?? payload?.__value);
    if (valueEl) valueEl.textContent = Number.isFinite(rawValue) ? rawValue.toFixed(decimals) : '—';

    if (!dateEl) return;
    if (mode === 'intraday') {
      const stamp = formatBeijingTimestamp(payload?.timestamp || payload?.live_quote_timestamp);
      const source = payload?.source || payload?.live_quote_source || 'Yahoo Finance';
      const status = payload?.quote_status || payload?.live_quote_status || '';
      dateEl.textContent = `Intraday · ${stamp || '—'} · ${source}${status ? ' · '+status : ''}`;
    } else {
      const obs = payload?.observation_date || payload?.date || '—';
      dateEl.textContent = `Latest official · ${obs}`;
    }
  }

  function syncLiquidityQuotes() {
    ensureLiquidityQuoteLayout();
    if (typeof state === 'undefined' || !state?.raw) return;

    const live = marketQuotePayload?.quotes || {};
    const summary = marketSummaryPayload?.indicators || {};

    const q10 = live.dgs10 || summaryIntradayQuote('dgs10');
    const q30 = live.dgs30 || summaryIntradayQuote('dgs30');
    const qVix = live.vix || summaryIntradayQuote('vix');

    setLiquidityQuote('liq10y', q10 || latestFiniteRow(state.raw.dgs10,'value'), q10 ? 3 : 2, q10 ? 'intraday' : 'daily');
    setLiquidityQuote('liq30y', q30 || latestFiniteRow(state.raw.dgs30,'value'), q30 ? 3 : 2, q30 ? 'intraday' : 'daily');
    setLiquidityQuote('liqReal10', summary.dfii10 || latestFiniteRow(state.raw.dfii10,'value'), 2, 'daily');
    setLiquidityQuote('liqHy', summary.hy_oas || latestFiniteRow(state.raw.hy,'value'), 2, 'daily');
    setLiquidityQuote('liqVix', qVix || latestFiniteRow(state.raw.vix,'close'), 2, qVix ? 'intraday' : 'daily');
    setLiquidityQuote('liqNfci', latestFiniteRow(state.raw.nfci,'value'), 3, 'daily');
  }

'''
              text = text[:start] + replacement + text[end:]

              old = """      if (quoteResponse.ok) marketQuotePayload = await quoteResponse.json();
      if (summaryResponse.ok) marketSummaryPayload = await summaryResponse.json();
      syncMarketQuotes();
    } catch (e) {
      console.warn('Market latest quote load failed',e);
      syncMarketQuotes();
"""
              new = """      if (quoteResponse.ok) marketQuotePayload = await quoteResponse.json();
      if (summaryResponse.ok) marketSummaryPayload = await summaryResponse.json();
      syncMarketQuotes();
      syncLiquidityQuotes();
    } catch (e) {
      console.warn('Market latest quote load failed',e);
      syncMarketQuotes();
      syncLiquidityQuotes();
"""
              if old not in text:
                  raise SystemExit('Could not locate market quote refresh block; refusing an unsafe patch.')
              text = text.replace(old, new, 1)

              old_nfci = """      if (typeof state !== 'undefined' && state?.raw) state.raw.nfci = rows;
      refreshLiquidityAfterNfci();
"""
              new_nfci = """      let waitCount = 0;
      while ((typeof state === 'undefined' || !state?.raw) && waitCount < 40) {
        await new Promise(resolve => setTimeout(resolve,50));
        waitCount += 1;
      }
      if (typeof state !== 'undefined' && state?.raw) state.raw.nfci = rows;
      refreshLiquidityAfterNfci();
"""
              if old_nfci in text:
                  text = text.replace(old_nfci, new_nfci, 1)

              p.write_text(text, encoding='utf-8')
          PY

      - name: Persist frontend fixes
        shell: bash
        run: |
          if ! git diff --quiet -- index.html assets/chart-time-slider.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html assets/chart-time-slider.js
            git commit -m "fix: use intraday quotes in liquidity headline tiles"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4