name: Deploy AI Bubble Monitor Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Update AI Bubble Market & Liquidity"
      - "Update AI Market Quotes"
      - "Update AI Bubble News Radar"
    types: [completed]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-bubble-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair and validate frontend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('assets/chart-time-slider.js')
          text = p.read_text(encoding='utf-8')
          marker = '// LIVE_LIQUIDITY_TILES_V2'
          start = text.find(marker)
          end = text.find('  function syncLiquiditySources()', start)
          if start >= 0 and end > start:
              block = text[start:end]
              block = re.sub(
                  r"if \(dateEl\) dateEl\.textContent = .*?;\n      return;",
                  "if (dateEl) dateEl.textContent = 'Latest: --';\n      return;",
                  block,
                  count=1,
              )
              block = re.sub(
                  r"dateEl\.textContent = `Intraday .*?`;",
                  "dateEl.textContent = `Intraday | ${stamp || '--'} | ${source}${status ? ' | '+status : ''}`;",
                  block,
                  count=1,
              )
              block = re.sub(
                  r"dateEl\.textContent = `Latest official .*?`;",
                  "dateEl.textContent = `Latest official | ${obs}`;",
                  block,
                  count=1,
              )
              text = text[:start] + block + text[end:]

          text = text.replace(
              '.market-card-enhanced{align-self:start!important;}',
              '.market-card-enhanced{align-self:stretch!important;}'
          )

          eq_marker = '  function equalizeMarketLiquidityCards() {'
          if eq_marker not in text:
              insert_at = text.find('  function scan() {')
              if insert_at < 0:
                  raise SystemExit('scan() insertion point not found')
              helper = '''  function equalizeMarketLiquidityCards() {
    const left = document.getElementById('marketChart')?.closest('.chart-card');
    const right = document.getElementById('liquidityChart')?.closest('.chart-card');
    if (!left || !right || left.parentElement !== right.parentElement) return;
    const row = left.parentElement;
    row.style.alignItems = 'stretch';
    if (window.innerWidth <= 760) {
      left.style.height = '';
      right.style.height = '';
      return;
    }
    left.style.height = 'auto';
    right.style.height = 'auto';
    const target = Math.ceil(Math.max(
      left.getBoundingClientRect().height,
      right.getBoundingClientRect().height
    ));
    if (target > 0) {
      left.style.height = `${target}px`;
      right.style.height = `${target}px`;
    }
  }

'''
              text = text[:insert_at] + helper + text[insert_at:]

          scan_needle = '''    syncLiquidityQuotes();
    syncLiquiditySources();
  }

  scan();'''
          scan_replacement = '''    syncLiquidityQuotes();
    syncLiquiditySources();
    requestAnimationFrame(equalizeMarketLiquidityCards);
  }

  window.addEventListener('resize', () => requestAnimationFrame(equalizeMarketLiquidityCards));

  scan();'''
          if 'window.addEventListener(\'resize\', () => requestAnimationFrame(equalizeMarketLiquidityCards));' not in text:
              if scan_needle not in text:
                  raise SystemExit('scan() call site not found')
              text = text.replace(scan_needle, scan_replacement, 1)

          p.write_text(text, encoding='utf-8')
          PY
          node --check assets/chart-time-slider.js

      - name: Persist frontend fixes
        shell: bash
        run: |
          if ! git diff --quiet -- assets/chart-time-slider.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/chart-time-slider.js
            git commit -m "fix: force equal market and liquidity card heights"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
