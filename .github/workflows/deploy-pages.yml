name: Deploy AI Bubble Monitor Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Update AI Bubble Market & Liquidity"
      - "Update AI Market Quotes"
      - "Update AI Bubble News Radar"
    types: [completed]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-bubble-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair and validate frontend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('assets/chart-time-slider.js')
          text = p.read_text(encoding='utf-8')
          marker = '// LIVE_LIQUIDITY_TILES_V2'
          start = text.find(marker)
          end = text.find('  function syncLiquiditySources()', start)
          if start >= 0 and end > start:
              block = text[start:end]
              block = re.sub(
                  r"if \(dateEl\) dateEl\.textContent = .*?;\n      return;",
                  "if (dateEl) dateEl.textContent = 'Latest: --';\n      return;",
                  block,
                  count=1,
              )
              block = re.sub(
                  r"dateEl\.textContent = `Intraday .*?`;",
                  "dateEl.textContent = `Intraday | ${stamp || '--'} | ${source}${status ? ' | '+status : ''}`;",
                  block,
                  count=1,
              )
              block = re.sub(
                  r"dateEl\.textContent = `Latest official .*?`;",
                  "dateEl.textContent = `Latest official | ${obs}`;",
                  block,
                  count=1,
              )
              text = text[:start] + block + text[end:]
              p.write_text(text, encoding='utf-8')
          PY
          node --check assets/chart-time-slider.js

      - name: Persist frontend fixes
        shell: bash
        run: |
          if ! git diff --quiet -- assets/chart-time-slider.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/chart-time-slider.js
            git commit -m "fix: repair live liquidity tile labels"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
