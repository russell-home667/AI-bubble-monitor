name: Deploy AI Bubble Monitor Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Update AI Bubble Market & Liquidity"
      - "Update AI Market Quotes"
      - "Update AI Bubble News Radar"
    types: [completed]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-bubble-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair and validate frontend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('assets/chart-time-slider.js')
          text = p.read_text(encoding='utf-8')
          marker = '// LIVE_LIQUIDITY_TILES_V2'
          start = text.find(marker)
          end = text.find('  function syncLiquiditySources()', start)
          if start >= 0 and end > start:
              block = text[start:end]
              block = re.sub(
                  r"if \(dateEl\) dateEl\.textContent = .*?;\n      return;",
                  "if (dateEl) dateEl.textContent = 'Latest: --';\n      return;",
                  block,
                  count=1,
              )
              block = re.sub(
                  r"dateEl\.textContent = `Intraday .*?`;",
                  "dateEl.textContent = `Intraday | ${stamp || '--'} | ${source}${status ? ' | '+status : ''}`;",
                  block,
                  count=1,
              )
              block = re.sub(
                  r"dateEl\.textContent = `Latest official .*?`;",
                  "dateEl.textContent = `Latest official | ${obs}`;",
                  block,
                  count=1,
              )
              text = text[:start] + block + text[end:]

          text = text.replace(
              '.market-card-enhanced{align-self:start!important;}',
              '.market-card-enhanced{align-self:stretch!important;}'
          )

          market_style_updates = {
              '.market-card-enhanced .chart-head{align-items:flex-start;gap:14px;}':
                  '.market-card-enhanced .chart-head{align-items:flex-start;gap:18px;padding:20px 22px 0;}',
              '.market-card-enhanced .chart-sub{max-width:560px;line-height:1.4;}':
                  '.market-card-enhanced .chart-sub{max-width:620px;line-height:1.55;margin-top:8px;}',
              '.market-card-enhanced .range{flex-wrap:nowrap;flex-shrink:0;gap:4px;}':
                  '.market-card-enhanced .range{flex-wrap:nowrap;flex-shrink:0;gap:7px;}',
              '.market-card-enhanced .range button{min-width:38px;}':
                  '.market-card-enhanced .range button{min-width:44px;padding:7px 10px;}',
              '.market-card-enhanced .source-row{font-size:9px;line-height:1.45;margin-top:4px;}':
                  '.market-card-enhanced .source-row{font-size:9px;line-height:1.6;margin-top:7px;}',
              '.market-card-enhanced #marketChart{height:360px!important;}':
                  '.market-card-enhanced #marketChart{height:430px!important;margin-top:10px;}',
              '#marketLatestGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:12px 16px 4px;border:1px solid rgba(89,151,190,.15);border-radius:12px;overflow:hidden;background:rgba(3,14,25,.22);}':
                  '#marketLatestGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:20px 22px 16px;border:1px solid rgba(89,151,190,.15);border-radius:14px;overflow:hidden;background:rgba(3,14,25,.22);}',
              '#marketLatestGrid .market-quote{min-width:0;padding:13px 16px 11px;border-right:1px solid rgba(89,151,190,.12);}':
                  '#marketLatestGrid .market-quote{min-width:0;padding:20px 22px 18px;border-right:1px solid rgba(89,151,190,.12);}',
              '#marketLatestGrid .market-value-row{display:flex;align-items:baseline;gap:7px;margin-top:7px;min-width:0;}':
                  '#marketLatestGrid .market-value-row{display:flex;align-items:baseline;gap:10px;margin-top:11px;min-width:0;}',
              '#marketLatestGrid .market-change{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:10px;font-weight:650;}':
                  '#marketLatestGrid .market-change{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:11px;font-size:10px;font-weight:650;}',
              '#marketLatestGrid .market-date{margin-top:6px;color:#5f7b92;font-size:9px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}':
                  '#marketLatestGrid .market-date{margin-top:10px;color:#5f7b92;font-size:9px;line-height:1.5;white-space:normal;overflow:visible;text-overflow:clip;min-height:27px;}',
          }
          for old, new in market_style_updates.items():
              text = text.replace(old, new)

          eq_marker = '  function equalizeMarketLiquidityCards() {'
          if eq_marker not in text:
              insert_at = text.find('  function scan() {')
              if insert_at < 0:
                  raise SystemExit('scan() insertion point not found')
              helper = "\n".join([
                  "  function equalizeMarketLiquidityCards() {",
                  "    const left = document.getElementById('marketChart')?.closest('.chart-card');",
                  "    const right = document.getElementById('liquidityChart')?.closest('.chart-card');",
                  "    if (!left || !right || left.parentElement !== right.parentElement) return;",
                  "    const row = left.parentElement;",
                  "    row.style.alignItems = 'stretch';",
                  "    if (window.innerWidth <= 760) {",
                  "      left.style.height = '';",
                  "      right.style.height = '';",
                  "      return;",
                  "    }",
                  "    left.style.height = 'auto';",
                  "    right.style.height = 'auto';",
                  "    const target = Math.ceil(Math.max(",
                  "      left.getBoundingClientRect().height,",
                  "      right.getBoundingClientRect().height",
                  "    ));",
                  "    if (target > 0) {",
                  "      left.style.height = `${target}px`;",
                  "      right.style.height = `${target}px`;",
                  "    }",
                  "  }",
                  "",
                  "",
              ])
              text = text[:insert_at] + helper + text[insert_at:]

          # Match the Aircraft Leasing dashboard interaction globally:
          # hovering a legend item focuses its series and blurs the others.
          focus_marker = '  function applyLegendSeriesFocus(option) {'
          if focus_marker not in text:
              insert_at = text.find('  function withAviationZoom(option, chartId) {')
              if insert_at < 0:
                  raise SystemExit('withAviationZoom() insertion point not found')
              focus_helper = "\n".join([
                  "  function applyLegendSeriesFocus(option) {",
                  "    if (!option || typeof option !== 'object') return option;",
                  "    const out = {...option};",
                  "    if (Array.isArray(out.series)) {",
                  "      out.series = out.series.map(series => {",
                  "        if (!series || typeof series !== 'object') return series;",
                  "        return {...series,emphasis:{...(series.emphasis||{}),focus:'series'}};",
                  "      });",
                  "    }",
                  "    return out;",
                  "  }",
                  "",
                  "",
              ])
              text = text[:insert_at] + focus_helper + text[insert_at:]

          old_patch = "\n".join([
              "  function patchChart(chart, chartId) {",
              "    if (!chart || patched.has(chart)) return;",
              "    const originalSetOption = chart.setOption.bind(chart);",
              "    chart.setOption = function(option,...args){ return originalSetOption(withAviationZoom(option,chartId),...args); };",
              "    patched.add(chart);",
              "    let initial = {grid:{bottom:57}};",
              "    if (chartId === 'marketChart') initial = tuneMarketOption(initial);",
              "    if (chartId === 'liquidityChart') initial = tuneLiquidityOption(initial);",
              "    originalSetOption({...initial,dataZoom:aviationDataZoom(chartId)},false);",
              "  }",
          ])
          new_patch = "\n".join([
              "  function patchChart(chart, chartId) {",
              "    if (!chart || patched.has(chart)) return;",
              "    const originalSetOption = chart.setOption.bind(chart);",
              "    chart.setOption = function(option,...args){",
              "      let next = applyLegendSeriesFocus(option);",
              "      if (TIME_CHART_IDS.has(chartId)) next = withAviationZoom(next,chartId);",
              "      return originalSetOption(next,...args);",
              "    };",
              "    patched.add(chart);",
              "    if (TIME_CHART_IDS.has(chartId)) {",
              "      let initial = {grid:{bottom:57}};",
              "      if (chartId === 'marketChart') initial = tuneMarketOption(initial);",
              "      if (chartId === 'liquidityChart') initial = tuneLiquidityOption(initial);",
              "      originalSetOption({...initial,dataZoom:aviationDataZoom(chartId)},false);",
              "    }",
              "  }",
          ])
          if old_patch in text:
              text = text.replace(old_patch, new_patch, 1)
          elif "let next = applyLegendSeriesFocus(option);" not in text:
              raise SystemExit('patchChart() shape changed; legend-focus patch not applied')

          # Safety hotfix: never retrofit emphasis by calling setOption with a
          # synthetic/incomplete series array on an already-rendered chart.
          # That can corrupt ECharts axis/series models and trigger internal
          # errors such as getAxesOnZeroOf is not a function.
          unsafe_current_focus = "\n".join([
              "    const current = chart.getOption?.();",
              "    if (Array.isArray(current?.series) && current.series.length) {",
              "      originalSetOption({series:current.series.map(series => ({",
              "        ...(series?.id != null ? {id:series.id} : {}),",
              "        ...(series?.name != null ? {name:series.name} : {}),",
              "        emphasis:{focus:'series'}",
              "      }))},false);",
              "    }",
          ])
          text = text.replace(unsafe_current_focus + "\n", "", 1)

          old_scan = "\n".join([
              "  function scan() {",
              "    TIME_CHART_IDS.forEach(id => {",
              "      const dom=document.getElementById(id); if (!dom) return;",
              "      const chart=echarts.getInstanceByDom(dom); if (chart) patchChart(chart,id);",
              "    });",
          ])
          new_scan = "\n".join([
              "  function scan() {",
              "    document.querySelectorAll('[_echarts_instance_]').forEach(dom => {",
              "      const chart=echarts.getInstanceByDom(dom); if (chart) patchChart(chart,dom.id||'');",
              "    });",
          ])
          if old_scan in text:
              text = text.replace(old_scan, new_scan, 1)
          elif "document.querySelectorAll('[_echarts_instance_]')" not in text:
              raise SystemExit('scan() shape changed; global chart scan not applied')

          init_marker = '__aiBubbleLegendFocusInitPatched'
          if init_marker not in text:
              insert_at = text.find('  function scan() {')
              if insert_at < 0:
                  raise SystemExit('scan() insertion point not found for init wrapper')
              init_helper = "\n".join([
                  "  if (!window.__aiBubbleLegendFocusInitPatched) {",
                  "    const originalEchartsInit = echarts.init.bind(echarts);",
                  "    echarts.init = function(dom,...args) {",
                  "      const chart = originalEchartsInit(dom,...args);",
                  "      patchChart(chart,dom?.id||'');",
                  "      return chart;",
                  "    };",
                  "    window.__aiBubbleLegendFocusInitPatched = true;",
                  "  }",
                  "",
                  "",
              ])
              text = text[:insert_at] + init_helper + text[insert_at:]

          resize_marker = "window.addEventListener('resize', () => requestAnimationFrame(equalizeMarketLiquidityCards));"
          if resize_marker not in text:
              scan_needle = "    syncLiquidityQuotes();\n    syncLiquiditySources();\n  }\n\n  scan();"
              scan_replacement = "    syncLiquidityQuotes();\n    syncLiquiditySources();\n    requestAnimationFrame(equalizeMarketLiquidityCards);\n  }\n\n  window.addEventListener('resize', () => requestAnimationFrame(equalizeMarketLiquidityCards));\n\n  scan();"
              if scan_needle not in text:
                  raise SystemExit('scan() call site not found')
              text = text.replace(scan_needle, scan_replacement, 1)

          p.write_text(text, encoding='utf-8')
          PY
          node --check assets/chart-time-slider.js

      - name: Persist frontend fixes
        shell: bash
        run: |
          if ! git diff --quiet -- assets/chart-time-slider.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/chart-time-slider.js
            git commit -m "fix: stabilize ECharts legend focus"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
