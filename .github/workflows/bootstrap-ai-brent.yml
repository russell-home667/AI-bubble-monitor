name: Bootstrap Brent into AI Bubble Monitor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-ai-brent.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install 'yfinance==1.7.0' 'requests>=2.32'
      - name: Seed data and patch dashboard
        run: python scripts/bootstrap_ai_brent_integration.py
      - name: Refresh Brent history
        run: python scripts/update_ai_brent.py
      - name: Refresh latest Brent quote
        continue-on-error: true
        run: python scripts/update_ai_brent_quote.py
      - name: Validate integration
        run: |
          test -s data/ai_bubble/macro/brent.json
          grep -q 'BRENT_MACRO_SECTION' index.html
          grep -q 'BRENT_STANDALONE_JS' index.html
          python - <<'PY'
          import json
          p=json.load(open('data/ai_bubble/macro/brent.json'))
          assert len(p['data']) > 1000
          assert p['ticker'] == 'BZ=F'
          print(len(p['data']), p['data'][0], p['data'][-1], p.get('latest_quote'))
          PY
      - name: Commit Brent data and dashboard
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ai_bubble/macro/brent.json index.html
          git commit -m 'Add Brent crude macro monitor'
          git pull --rebase origin main
          git push origin HEAD:main
