name: Update AI Market Quotes

on:
  workflow_dispatch:
  schedule:
    - cron: '30-59/5 9 * * 1-5'
      timezone: 'America/New_York'
    - cron: '*/5 10-15 * * 1-5'
      timezone: 'America/New_York'
    - cron: '0 16 * * 1-5'
      timezone: 'America/New_York'

permissions:
  contents: write

concurrency:
  group: ai-market-quotes
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh latest market quotes
        run: python scripts/update_ai_market_quotes.py

      - name: Validate quote payload
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/ai_bubble/market_liquidity/market_quotes.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          q=d.get('quotes') or {}
          missing=[k for k in ('ndx','sox','nvda') if k not in q or q[k].get('price') is None]
          if missing:
              raise SystemExit(f'Missing live quote(s): {missing}')
          print({k:(q[k].get('price'),q[k].get('timestamp')) for k in ('ndx','sox','nvda')})
          PY

      - name: Commit refreshed quotes
        run: |
          set -euo pipefail
          if git diff --quiet -- data/ai_bubble/market_liquidity/market_quotes.json; then
            echo 'No new quote bars to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ai_bubble/market_liquidity/market_quotes.json
          git commit -m 'data: update NDX SOX NVDA quotes'
          git pull --rebase origin main
          git push origin HEAD:main
