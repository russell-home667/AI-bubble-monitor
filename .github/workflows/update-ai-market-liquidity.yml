name: Update AI Bubble Market & Liquidity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_ai_market_liquidity.py'
      - '.github/workflows/update-ai-market-liquidity.yml'
  schedule:
    - cron: '30 5 * * 2-6'
      timezone: 'Asia/Shanghai'
    - cron: '15 6 * * 2-6'
      timezone: 'Asia/Shanghai'
    - cron: '30 6 * * 2-6'
      timezone: 'Asia/Shanghai'
    - cron: '0 8 * * 2-6'
      timezone: 'Asia/Shanghai'
    - cron: '0 9 * * 2-6'
      timezone: 'Asia/Shanghai'
    - cron: '30 22 * * 1-5'
      timezone: 'Asia/Shanghai'
    - cron: '30 23 * * 1-5'
      timezone: 'Asia/Shanghai'
    - cron: '30 0 * * 2-6'
      timezone: 'Asia/Shanghai'

permissions:
  contents: write

concurrency:
  group: ai-bubble-market-liquidity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'pandas>=2.2' 'numpy>=2.0' 'requests>=2.32' 'yfinance>=0.2.65'
      - name: Resolve update groups
        id: groups
        shell: bash
        run: |
          EVENT='${{ github.event_name }}'
          SCHEDULE='${{ github.event.schedule }}'
          BASE='data/ai_bubble/market_liquidity'
          BOOTSTRAP_MISSING=0
          for f in dgs10.csv dgs30.csv dfii10.csv vix.csv; do
            if [[ ! -s "$BASE/$f" ]]; then
              BOOTSTRAP_MISSING=1
            fi
          done

          if [[ "$EVENT" == "push" && "$BOOTSTRAP_MISSING" == "1" ]]; then
            # First rebuild after the source switch: fetch only the four affected
            # series instead of re-downloading unrelated market and credit history.
            GROUPS_TO_RUN='macro vix'
          elif [[ "$EVENT" == "workflow_dispatch" || "$EVENT" == "push" ]]; then
            GROUPS_TO_RUN='all'
          else
            case "$SCHEDULE" in
              '30 5 * * 2-6') GROUPS_TO_RUN='macro' ;;
              '15 6 * * 2-6') GROUPS_TO_RUN='market' ;;
              '30 6 * * 2-6') GROUPS_TO_RUN='macro vix' ;;
              '0 8 * * 2-6') GROUPS_TO_RUN='macro' ;;
              '0 9 * * 2-6') GROUPS_TO_RUN='vix' ;;
              '30 22 * * 1-5'|'30 23 * * 1-5'|'30 0 * * 2-6') GROUPS_TO_RUN='credit' ;;
              *) GROUPS_TO_RUN='all' ;;
            esac
          fi
          echo "bootstrap_missing=$BOOTSTRAP_MISSING"
          echo "groups=$GROUPS_TO_RUN" >> "$GITHUB_OUTPUT"
      - name: Update data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          PYTHONUNBUFFERED: '1'
        shell: bash
        run: |
          set -euo pipefail
          for group in ${{ steps.groups.outputs.groups }}; do
            python scripts/update_ai_market_liquidity.py --group "$group"
          done
      - name: Validate generated module
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path

          base=Path('data/ai_bubble/market_liquidity')
          d=json.loads((base/'latest.json').read_text(encoding='utf-8'))
          i=d.get('indicators') or {}
          for key in ('dgs10','dgs30','dfii10','vix'):
              if key not in i:
                  raise SystemExit(f'Missing indicator {key}')

          expected={
              'dgs10':('U.S. Department of the Treasury','BC_10YEAR','value'),
              'dgs30':('U.S. Department of the Treasury','BC_30YEAR','value'),
              'dfii10':('U.S. Department of the Treasury','TC_10YEAR','value'),
              'vix':('Yahoo Finance','^VIX','close'),
          }
          for key,(source,symbol,value_col) in expected.items():
              df=pd.read_csv(base/f'{key}.csv')
              if df.empty:
                  raise SystemExit(f'{key}.csv empty')
              if value_col not in df.columns:
                  raise SystemExit(f'{key}.csv missing {value_col} column: {list(df.columns)}')
              sources=set(df['source'].dropna().astype(str).unique())
              symbols=set(df['source_symbol'].dropna().astype(str).unique())
              if sources != {source}:
                  raise SystemExit(f'{key} source contamination: {sources}')
              if symbols != {symbol}:
                  raise SystemExit(f'{key} symbol contamination: {symbols}')
              last=df.dropna(subset=['date',value_col]).iloc[-1]
              print(key, last['date'], last[value_col], source, symbol)
          PY
      - name: Commit refreshed data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ai_bubble/market_liquidity/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: refresh AI bubble market liquidity'
          git pull --rebase origin main
          git push origin HEAD:main
