name: Update AI Compute Fundamentals

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_ai_compute_fundamentals.py'
      - 'scripts/canonicalize_nvda_periods.py'
      - 'data/ai_bubble/compute_fundamentals/nvda_official_overrides.csv'
      - '.github/workflows/update-ai-compute-fundamentals.yml'
  schedule:
    - cron: '0 9 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '40 13 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '10 14 * * *'
      timezone: 'Asia/Shanghai'

permissions:
  contents: write

concurrency:
  group: ai-compute-fundamentals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'pandas>=2.2' 'requests>=2.32' 'yfinance>=0.2.65' 'lxml>=5.0'
      - name: Resolve update group
        id: group
        shell: bash
        run: |
          EVENT='${{ github.event_name }}'
          SCHEDULE='${{ github.event.schedule }}'
          if [[ "$EVENT" == "workflow_dispatch" || "$EVENT" == "push" ]]; then
            GROUP='all'
          else
            case "$SCHEDULE" in
              '0 9 * * *') GROUP='nvda' ;;
              '40 13 * * *'|'10 14 * * *') GROUP='tsmc' ;;
              *) GROUP='all' ;;
            esac
          fi
          echo "group=$GROUP" >> "$GITHUB_OUTPUT"
      - name: Update compute fundamentals
        run: |
          set -euo pipefail
          python scripts/update_ai_compute_fundamentals.py --group '${{ steps.group.outputs.group }}'
          python scripts/canonicalize_nvda_periods.py
      - name: Validate generated module
        run: |
          python - <<'PY'
          import json
          import subprocess
          from datetime import date, timedelta
          from pathlib import Path
          import pandas as pd

          p=Path('data/ai_bubble/compute_fundamentals/latest.json')
          if not p.exists(): raise SystemExit('latest.json missing')
          d=json.loads(p.read_text(encoding='utf-8'))
          if d.get('errors'): raise SystemExit(f"Errors: {d['errors']}")
          n=d.get('nvda') or {}; t=d.get('tsmc') or {}
          required=['data_center_revenue_usd_bn','gross_margin_pct','inventory_usd_bn','inventory_days','accounts_receivable_usd_bn','dso_days']
          missing=[k for k in required if n.get(k) is None]
          if missing: raise SystemExit(f'Missing NVDA fields: {missing}')

          period_raw=n.get('period_end')
          try:
              period=pd.Timestamp(period_raw).date()
          except Exception as exc:
              raise SystemExit(f'Invalid NVDA period_end {period_raw!r}: {exc}')
          if period > date.today() + timedelta(days=7):
              raise SystemExit(f'NVDA period_end is implausibly in the future: {period}')
          if period < date(2024,1,1):
              raise SystemExit(f'NVDA period_end regressed too far: {period}')

          csv=Path('data/ai_bubble/compute_fundamentals/nvda_quarterly.csv')
          q=pd.read_csv(csv)
          q['period_end']=pd.to_datetime(q['period_end'],errors='coerce')
          q=q.dropna(subset=['period_end']).sort_values('period_end')
          if q.empty: raise SystemExit('nvda_quarterly.csv empty')
          csv_latest=q.iloc[-1]['period_end'].date()
          if csv_latest != period:
              raise SystemExit(f'latest.json / nvda_quarterly.csv mismatch: {period} vs {csv_latest}')

          # Compare against the committed baseline when one exists. Future quarters are
          # accepted automatically; regressions are not.
          try:
              old_raw=subprocess.check_output(
                  ['git','show','HEAD:data/ai_bubble/compute_fundamentals/latest.json'],
                  text=True,
                  stderr=subprocess.DEVNULL,
              )
              old=json.loads(old_raw)
              old_period=pd.Timestamp((old.get('nvda') or {}).get('period_end')).date()
              if period < old_period:
                  raise SystemExit(f'NVDA period regressed: {period} < {old_period}')
          except subprocess.CalledProcessError:
              pass

          if t.get('revenue_twd_mn') is None or t.get('yoy_pct_reported') is None or t.get('rolling_3m_yoy_pct') is None:
              raise SystemExit('TSMC latest incomplete')
          print('NVDA period:', period, 'TSMC month:', t.get('month'))
          PY
      - name: Commit refreshed data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ai_bubble/compute_fundamentals/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: refresh AI compute fundamentals'
          bash scripts/git_commit_push_retry.sh
