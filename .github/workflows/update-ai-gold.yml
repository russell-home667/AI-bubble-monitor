name: Update AI Gold XAUUSD

on:
  workflow_dispatch:
    inputs:
      full_backfill:
        description: 'Force full XAU/USD history backfill'
        required: false
        default: 'false'
  push:
    branches: [main]
    paths:
      - 'scripts/update_ai_gold.py'
      - '.github/workflows/update-ai-gold.yml'
  schedule:
    # Every 30 minutes, Monday-Saturday. Display timestamps remain Beijing time.
    - cron: '*/30 * * * 1-6'

permissions:
  contents: write

concurrency:
  group: ai-gold-xauusd
  cancel-in-progress: true

jobs:
  update:
    # Direct HistoricalDataAjax requests work from GitHub-hosted Linux runners;
    # no repeated full-page priming is used, which avoids the earlier Cloudflare issue.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --disable-pip-version-check curl-cffi beautifulsoup4

      - name: Update XAU/USD
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full_backfill }}" = "true" ]; then
            python scripts/update_ai_gold.py --full
          else
            python scripts/update_ai_gold.py
          fi

      - name: Validate gold data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/ai_bubble/macro/gold_xauusd.json')
          d=json.loads(p.read_text())
          rows=d.get('data',[])
          assert d.get('ticker') == 'XAU/USD'
          assert d.get('instrument_id') == '68'
          assert len(rows) >= 20
          assert rows[-1]['value'] > 100
          print('rows',len(rows),'coverage',rows[0]['date'],'to',rows[-1]['date'],'latest',d['latest_quote']['price'])
          PY

      - name: Commit data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ai_bubble/macro/gold_xauusd.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: update XAU/USD gold'
          git pull --rebase origin main
          git push origin HEAD:main
