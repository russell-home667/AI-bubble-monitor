name: Update AI Gold XAUUSD

on:
  workflow_dispatch:
    inputs:
      full_backfill:
        description: 'Force full XAU/USD history refresh'
        required: false
        default: 'false'
  push:
    branches: [main]
    paths:
      - 'scripts/update_ai_gold.py'
      - '.github/workflows/update-ai-gold.yml'
  schedule:
    # AI Bubble Monitor convention: every 10 minutes, every day.
    - cron: '*/10 * * * *'

permissions:
  contents: write

concurrency:
  group: ai-gold-xauusd
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --disable-pip-version-check requests curl_cffi

      - name: Update XAU/USD spot gold
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full_backfill }}" = "true" ]; then
            python scripts/update_ai_gold.py --full
          else
            python scripts/update_ai_gold.py
          fi

      - name: Validate AI Bubble Monitor gold format
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/ai_bubble/macro/gold_xauusd.json')
          d = json.loads(p.read_text())
          rows = d.get('data', [])
          quote = d.get('latest_quote', {})
          assert d.get('ticker') == 'XAU/USD'
          assert d.get('unit') == 'USD/oz'
          assert d.get('instrument_type') == 'spot'
          assert d.get('historical_source') == 'World Bank Commodity Markets (Pink Sheet)'
          assert len(rows) >= 1500
          assert rows[0]['date'] <= '1990-01-01'
          assert rows == sorted(rows, key=lambda x: x['date'])
          assert all('date' in x and 'value' in x for x in rows)
          assert any(x.get('frequency') == 'monthly_average' for x in rows[:500])
          assert float(rows[-1]['value']) > 100
          assert float(quote['price']) > 100
          assert float(quote['previous_close']) > 100
          assert quote.get('previous_close_source')
          assert isinstance(quote.get('change_vs_previous_close_pct'), (int, float))
          assert quote.get('timestamp')
          assert d.get('updated_at_bjt')
          print('rows', len(rows), 'coverage', rows[0]['date'], 'to', rows[-1]['date'], 'latest', quote['price'], 'prev', quote['previous_close'], 'change%', quote['change_vs_previous_close_pct'], 'prev_source', quote['previous_close_source'], 'prev_date', quote.get('previous_close_observation_date'), 'status', d.get('status'), 'daily_source', d.get('daily_source'))
          PY

      - name: Commit data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ai_bubble/macro/gold_xauusd.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: update XAU/USD gold'
          bash scripts/git_commit_push_retry.sh

# explicit refresh trigger: 2026-09-16 XAUS prior-close fallback validation
