name: Audit Fix Source Links

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_fix_source_links.py'
      - '.github/workflows/audit-fix-source-links.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply audited source-link corrections
        run: python scripts/audit_fix_source_links.py
      - name: Validate exact source strings
        run: |
          grep -q 'cdn.cboe.com/api/global/us_indices/daily_prices/VIX_History.csv' assets/source-links.js
          grep -q 'fredgraph.csv' assets/source-links.js
          grep -q 'query2.finance.yahoo.com/v8/finance/chart' assets/source-links.js
          grep -q 'fundamentals-timeseries' assets/source-links.js
          grep -q 'amzn-20260630.htm' assets/source-links.js
          grep -q 'NVDA-2027-Q2-10Q-Final-including-exhibits.pdf' assets/source-links.js
          grep -q 'monthly-revenue/2026' assets/source-links.js
          grep -q 'www.runpod.io/gpu-models' assets/source-links.js
      - name: Commit corrected links
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/source-links.js
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'fix: align dashboard links with acquisition endpoints'
          git pull --rebase origin main
          git push origin HEAD:main
