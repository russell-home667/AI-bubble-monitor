name: Diagnose Investing Gold Proxy
on:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose_investing_gold.py'
      - '.github/workflows/diagnose-investing-gold.yml'
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check curl-cffi
      - run: python scripts/diagnose_investing_gold.py
