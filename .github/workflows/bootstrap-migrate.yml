name: Bootstrap AI Bubble Monitor Migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-migrate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout new repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source repository
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/russell-home667/aviation-leasing-dashboard.git /tmp/source

      - name: Copy AI Bubble data, pages and scripts
        run: |
          set -euo pipefail
          mkdir -p data scripts
          cp -R /tmp/source/data/ai_bubble data/
          cp /tmp/source/ai-bubble/index.html ./index.html
          cp /tmp/source/ai-bubble/backtest.html ./backtest.html
          cp /tmp/source/scripts/*ai*.py scripts/
          if [ -f /tmp/source/AI_BUBBLE_CALIBRATION.md ]; then
            cp /tmp/source/AI_BUBBLE_CALIBRATION.md ./AI_BUBBLE_CALIBRATION.md
          fi

      - name: Make project standalone
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in ['index.html', 'backtest.html']:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              s = s.replace("../data/ai_bubble/", "data/ai_bubble/")
              s = s.replace('<a class="navbtn" href="../">← Aviation Dashboard</a>', '')
              p.write_text(s, encoding='utf-8')

          for root in [Path('scripts'), Path('data/ai_bubble')]:
              for p in root.rglob('*'):
                  if p.is_file() and p.suffix.lower() in {'.py','.md','.json','.csv'}:
                      try:
                          s = p.read_text(encoding='utf-8')
                      except UnicodeDecodeError:
                          continue
                      s2 = s.replace('russell-home667/aviation-leasing-dashboard', 'russell-home667/AI-bubble-monitor')
                      if s2 != s:
                          p.write_text(s2, encoding='utf-8')
          PY

      - name: Commit migrated project files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md index.html backtest.html data scripts
          if [ -f AI_BUBBLE_CALIBRATION.md ]; then git add AI_BUBBLE_CALIBRATION.md; fi
          if git diff --cached --quiet; then
            echo 'No project file changes to commit.'
            exit 0
          fi
          git commit -m 'Migrate standalone AI Bubble Monitor project files'
          git push origin main
