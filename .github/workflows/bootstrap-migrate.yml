name: Bootstrap AI Bubble Monitor Migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-migrate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout new repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source repository
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/russell-home667/aviation-leasing-dashboard.git /tmp/source

      - name: Copy complete AI Bubble project
        run: |
          set -euo pipefail
          mkdir -p data scripts .github/workflows
          cp -R /tmp/source/data/ai_bubble data/
          cp /tmp/source/ai-bubble/index.html ./index.html
          cp /tmp/source/ai-bubble/backtest.html ./backtest.html
          cp /tmp/source/scripts/*ai*.py scripts/
          cp /tmp/source/.github/workflows/*ai*.yml .github/workflows/
          if [ -f /tmp/source/AI_BUBBLE_CALIBRATION.md ]; then
            cp /tmp/source/AI_BUBBLE_CALIBRATION.md ./AI_BUBBLE_CALIBRATION.md
          fi

      - name: Make project standalone
        run: |
          python - <<'PY'
          from pathlib import Path

          # Dashboard pages now live at repository root.
          for name in ['index.html', 'backtest.html']:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              s = s.replace("../data/ai_bubble/", "data/ai_bubble/")
              s = s.replace('<a class="navbtn" href="../">← Aviation Dashboard</a>', '')
              p.write_text(s, encoding='utf-8')

          # Replace old repository identity anywhere it is embedded in AI code/workflows/docs.
          for root in [Path('scripts'), Path('.github/workflows'), Path('data/ai_bubble')]:
              for p in root.rglob('*'):
                  if p.is_file() and p.suffix.lower() in {'.py','.yml','.yaml','.md','.json','.csv'}:
                      try:
                          s = p.read_text(encoding='utf-8')
                      except UnicodeDecodeError:
                          continue
                      s2 = s.replace('russell-home667/aviation-leasing-dashboard', 'russell-home667/AI-bubble-monitor')
                      if s2 != s:
                          p.write_text(s2, encoding='utf-8')
          PY

      - name: Add standalone GitHub Pages deployment
        run: |
          cat > .github/workflows/deploy-pages.yml <<'YAML'
          name: Deploy AI Bubble Monitor Pages

          on:
            push:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read
            pages: write
            id-token: write

          concurrency:
            group: ai-bubble-pages
            cancel-in-progress: true

          jobs:
            deploy:
              runs-on: ubuntu-latest
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              steps:
                - name: Checkout
                  uses: actions/checkout@v4
                - name: Configure Pages
                  uses: actions/configure-pages@v5
                  with:
                    enablement: true
                - name: Upload Pages artifact
                  uses: actions/upload-pages-artifact@v4
                  with:
                    path: '.'
                - name: Deploy to GitHub Pages
                  id: deployment
                  uses: actions/deploy-pages@v4
          YAML

      - name: Remove one-time bootstrap workflow
        run: rm -f .github/workflows/bootstrap-migrate.yml

      - name: Commit migrated project
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Migrate standalone AI Bubble Monitor project'
          git push origin main
